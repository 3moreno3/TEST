<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Coming Soon</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
      }

      main {
        text-align: center;
        padding: 2.5rem;
        max-width: 680px;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      p {
        margin: 0 auto 1.75rem;
        color: #cbd5e1;
        line-height: 1.6;
      }

      .badges {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-block;
        padding: 0.75rem 1.1rem;
        border-radius: 999px;
        border: 1px solid #475569;
        color: #f8fafc;
        text-decoration: none;
        font-weight: 600;
      }

      .badge:hover {
        background: rgba(248, 250, 252, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Our app is coming soon</h1>
      <p>
        We are getting ready to launch on the App Store and Google Play. Check back soon
        for the official release.
      </p>
      <div class="badges">
        <a class="badge" href="#" aria-disabled="true">Coming soon on the App Store</a>
        <a class="badge" href="#" aria-disabled="true">Coming soon on Google Play</a>
      </div>
    </main>
  </body>
</html>
